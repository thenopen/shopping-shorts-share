# CI — push/PR 시 자동 검증. 풀 의존성(torch 포함)으로 프로덕션 환경과 동일하게.
# 3개 잡: core-test(Python), web-test(Node), schema-sync(스키마 정합성).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  core-test:
    name: Core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/core/requirements*.txt

      - name: 시스템 의존성(ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: torch 설치(CPU, 사전)
        # torch는 큰 패키지라 requirements 보다 먼저 CPU 인덱스로 설치 → 용량·시간 절감.
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: 코어 의존성 설치
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install --no-deps simple-lama-inpainting || echo "(simple-lama 설치 스킵 — 테스트에 영향 없음)"

      - name: pytest 실행
        run: python -m pytest

      - name: 커버리지 리포트(요약)
        run: |
          python -m pytest --cov=app.pipeline.caption --cov=app.security --cov=app.auth_token \
            --cov=app._schema_gen --cov-report=term-missing -q 2>&1 | tail -20 || true

  web-test:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    defaults:
      run:
        working-directory: packages/web

    steps:
      - uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크(tsc)
        run: npm test

  schema-sync:
    name: 스키마 정합성
    runs-on: ubuntu-latest
    needs: core-test   # 코어 의존성 설치 후 실행
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/core/requirements*.txt

      - name: 최소 의존성 설치(스키마 생성용 — heavy 패키지 불필요)
        # 스키마 생성은 fastapi/pydantic/uvicorn만 필요(server_api top-level import 체인).
        run: |
          pip install fastapi==0.115.6 uvicorn[standard]==0.34.0 pydantic==2.10.4 python-multipart==0.0.20 pytest==8.4.4

      - name: 스키마 재생성 후 git diff 검증
        # gen-schema.py 실행 결과가 커밋된 스키마와 같은지 → 다르면(코드 변경 후 재생성 누락) 실패.
        run: |
          python scripts/gen-schema.py
          git diff --exit-code -- shared/schema/job.schema.json && echo "스키마 동기화 OK" || ( \
            echo "::error::스키마가 코드와 불일치. 'python scripts/gen-schema.py' 실행 후 커밋하세요." && exit 1 )

      - name: 정합성 테스트
        working-directory: packages/core
        run: python -m pytest tests/test_schema_sync.py -v
